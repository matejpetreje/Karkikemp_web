<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Velekára</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .photo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Osoba je v originálu přibližně na 57 % šířky a 70 % výšky. */
      object-position: 57% 70%;
      display: block;
    }
    @media (orientation: landscape) {
      .photo { object-position: 57% 72%; }
    }
  </style>
</head>
<body>
  <img class="photo" src="velekara.jpg" alt="Velekára">
</body>
</html>
